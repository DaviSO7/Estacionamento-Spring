<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Estacionamento - Erro Login</title>
  <style>
    /* Reset e estilos base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    /* Fundo com efeito tecnológico */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
            linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        z-index: 0;
    }

    .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 50px 60px;
        border-radius: 20px;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.3),
            0 0 40px rgba(229, 62, 62, 0.3);
        max-width: 500px;
        width: 100%;
        position: relative;
        z-index: 1;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: shake 0.8s ease-in-out, slideUp 0.6s ease-out;
        text-align: center;
    }

    .container:hover {
        transform: translateY(-5px);
        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.4),
            0 0 60px rgba(229, 62, 62, 0.4);
    }

    /* Ícone de erro */
    .error-icon {
        font-size: 70px;
        display: block;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
    }

    h1 {
        color: #e53e3e;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 15px;
        position: relative;
        display: inline-block;
    }

    h1::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: linear-gradient(90deg, #fc8181, #e53e3e);
        border-radius: 2px;
        box-shadow: 0 0 20px rgba(229, 62, 62, 0.5);
    }

    .message {
        color: #4a5568;
        font-size: 16px;
        margin-top: 25px;
        margin-bottom: 25px;
    }

    .btn-voltar {
        display: inline-block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        padding: 12px 35px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .btn-voltar::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s ease;
    }

    .btn-voltar:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .btn-voltar:hover::before {
        left: 100%;
    }

    /* Animações */
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10% { transform: translateX(-10px); }
        20% { transform: translateX(10px); }
        30% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        50% { transform: translateX(-5px); }
        60% { transform: translateX(5px); }
        70% { transform: translateX(-5px); }
        80% { transform: translateX(5px); }
        90% { transform: translateX(-2px); }
        100% { transform: translateX(0); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    /* Responsividade */
    @media (max-width: 480px) {
        .container {
            padding: 30px 20px;
            margin: 10px;
        }

        .error-icon {
            font-size: 50px;
        }

        h1 {
            font-size: 22px;
        }

        .message {
            font-size: 14px;
        }

        .btn-voltar {
            padding: 10px 25px;
            font-size: 13px;
            width: 100%;
        }
    }
  </style>
</head>
<body>
<div class="container">
  <span class="error-icon">❌</span>
  <h1>Usuário ou senha inválido!</h1>
  <p class="message">Por favor, verifique suas credenciais e tente novamente.</p>
  <a href="/" class="btn-voltar">↩ Voltar ao Login</a>
</div>
</body>
</html>
