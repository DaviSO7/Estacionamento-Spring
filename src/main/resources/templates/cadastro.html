<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Estacionamento - Cadastro</title>
    <style>
        /* Reset e estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Fundo com efeito tecnológico */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        form {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(102, 126, 234, 0.3);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        form:hover {
            transform: translateY(-5px);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(102, 126, 234, 0.4);
        }

        h2 {
            color: #2d3748;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            letter-spacing: 1px;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        h4 {
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            margin: 5px 0 8px 0;
            text-align: left;
            letter-spacing: 0.5px;
        }

        h3 {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 400;
            color: #4a5568;
        }

        h3 a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        h3 a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        h3 a:hover {
            color: #764ba2;
        }

        h3 a:hover::after {
            width: 100%;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0 16px 0;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f7fafc;
            color: #2d3748;
            outline: none;
            font-family: inherit;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        /* Delay para cada input */
        input:nth-child(1) { animation-delay: 0.1s; }
        input:nth-child(2) { animation-delay: 0.2s; }
        input:nth-child(3) { animation-delay: 0.3s; }
        input:nth-child(4) { animation-delay: 0.4s; }
        input:nth-child(5) { animation-delay: 0.5s; }
        input:nth-child(6) { animation-delay: 0.6s; }

        input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: scale(1.01);
        }

        input::placeholder {
            color: #a0aec0;
            font-weight: 300;
        }

        input:hover {
            border-color: #a0aec0;
            background: white;
        }

        /* Inputs específicos */
        input[type="date"] {
            color: #2d3748;
            cursor: pointer;
            padding: 10px 16px;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:hover::before {
            left: 100%;
        }

        button[type="submit"]:active {
            transform: translateY(0px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* Animações */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsividade */
        @media (max-width: 480px) {
            form {
                padding: 25px 20px;
                margin: 10px;
            }

            h2 {
                font-size: 24px;
            }

            input {
                padding: 10px 14px;
                font-size: 13px;
            }

            button[type="submit"] {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<form method="post" action="/efetuarCadastro">
    <h2>Cadastro</h2>

    <input type="text" name="inputNomeCadastro" id="inputNome" placeholder="Insira seu nome">
    <input type="number" name="inputCPFCadastro" id="inputCPF" placeholder="Insira seu CPF">
    <input type="email" id="inputEmailCadastro" name="inputEmailCadastro" placeholder="Insira seu email">
    <input type="password" id="inputSenhaCadastro" name="inputSenhaCadastro" placeholder="Insira sua senha">

    <h4>Insira sua data de nascimento</h4>
    <input type="date" name="inputDataNascimentoCadastro" id="inputDataNascimento">

    <input type="number" name="inputTelefone" id="inputTelefone" placeholder="Insira seu telefone">

    <button type="submit">Cadastrar</button>

    <h3>Já tem cadastro? <a href="/">Clique aqui</a></h3>
</form>
</body>
</html>
