<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Estacionamento - Painel</title>
  <style>
    /* Reset e estilos base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        flex-direction: column;
    }

    /* Fundo com efeito tecnológico */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
            linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        z-index: 0;
    }

    .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 50px 60px;
        border-radius: 20px;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.3),
            0 0 40px rgba(102, 126, 234, 0.3);
        max-width: 600px;
        width: 100%;
        position: relative;
        z-index: 1;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: slideUp 0.6s ease-out;
        text-align: center;
    }

    .container:hover {
        transform: translateY(-5px);
        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.4),
            0 0 60px rgba(102, 126, 234, 0.4);
    }

    h1 {
        color: #2d3748;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 15px;
        position: relative;
        display: inline-block;
    }

    h1::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2);
        border-radius: 2px;
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
    }

    h1::before {
        content: '🚗 ';
        font-size: 32px;
    }

    h2 {
        color: #4a5568;
        font-size: 20px;
        font-weight: 400;
        margin-top: 25px;
        animation: pulse 2s ease-in-out infinite;
    }

    /* Animações */
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }

    /* Responsividade */
    @media (max-width: 480px) {
        .container {
            padding: 30px 20px;
            margin: 10px;
        }

        h1 {
            font-size: 24px;
        }

        h1::before {
            font-size: 24px;
        }

        h2 {
            font-size: 17px;
        }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Painel Estacionamento</h1>
  <h2>Implementações virão!!!!</h2>
</div>
</body>
</html>
